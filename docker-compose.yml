services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fitquest-frontend
    restart: unless-stopped
    environment:
      EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-http://localhost:8000}
      EXPO_NO_TELEMETRY: "1"
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    ports:
      - "${FRONTEND_PORT:-8081}:8081"
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    command: npm run docker:web

volumes:
  frontend_node_modules:
